name: TooLong
options:
  bundleIdPrefix: com.lorenzoderiu
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  TooLong:
    type: application
    platform: macOS
    sources:
      - path: TooLong
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: TooLong/Resources/TooLong.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.lorenzoderiu.toolong
        PRODUCT_NAME: "Too Long"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: TooLong/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Too Long"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Too Long uses the microphone when you choose to record a voice note."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Too Long transcribes voice notes on this Mac."
        ENABLE_APP_SANDBOX: true
        ENABLE_USER_SELECTED_FILES: readonly
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: true
        ENABLE_AUDIO_INPUT: true
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true

  TooLongTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TooLongTests
    dependencies:
      - target: TooLong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lorenzoderiu.toolong.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Too Long.app/Contents/MacOS/Too Long"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TooLong:
    build:
      targets:
        TooLong: all
        TooLongTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TooLongTests
